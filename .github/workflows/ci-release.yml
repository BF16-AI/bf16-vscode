name: CI & VSIX Package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build-vsix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
      - name: Attach VSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" *.vsix --clobber || gh release create "${GITHUB_REF_NAME}" *.vsix --title "${GITHUB_REF_NAME}" --notes "Automated VSIX build for VS Code / Cursor / Windsurf."
